# Al-Nass Insights — frontend-nginx config for STACK_NAME=prod
# Baked into the image at docker build (see frontend/Dockerfile ARG STACK_NAME).
#   /              → SPA
#   /api/ /health/ → backend:8080
# OpenAPI / Scalar are not exposed in production.

upstream backend {
    server backend:8080;
}

server {
    listen 80;
    server_name dashboard.alnaseg.dynv6.net _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Alnass-Stack "prod" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /health/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Docs endpoints disabled at the edge in production
    location /openapi/ {
        return 404;
    }

    location /scalar/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Alnass-Stack "prod" always;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
