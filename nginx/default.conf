# OPTIONAL — hospital outer reverse proxy / TLS edge (not part of the 4-container stack).
# Each stack already exposes UI+API from alnass-{env}-frontend.
#
# Use this file on a separate host nginx/IIS when mapping:
#   https://dashboard.alnaseg.dynv6.net  →  http://127.0.0.1:80   (prod stack)
#   https://ppr.dashboard...            →  http://127.0.0.1:8081 (ppr stack)
#
# The docker compose stacks do NOT mount this file.

upstream alnass_prod_frontend {
    server 127.0.0.1:80;
}

server {
    listen 443 ssl;
    server_name dashboard.alnaseg.dynv6.net;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://alnass_prod_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
}
